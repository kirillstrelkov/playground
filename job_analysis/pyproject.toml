[project]
name = "job-analysis"
version = "0.1.0"
description = "Analyze job postings from Google Sheet links using LLMs (Perplexity or Gemini)"
authors = [ { name = "Kirill" } ]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "click>=8.1",
  "pandas>=2.2",
  "google-api-python-client>=2.143.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.1",
  "selenium>=4.35.0",
  "tenacity>=9.1.2",
  "loguru>=0.7.3",
  "google-genai>=1.38.0",
  "ruff>=0.13.1",
  "openai>=1.109.0",
  "jupyter>=1.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "ipykernel>=6.29",
  "jupyter>=1.1",
]

[project.scripts]
job-analyze = "job_analysis.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E","F","I","B","UP","SIM","C90","N","S","T20"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["job_analysis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
